<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Oficinas Vue.js</title>

  <!-- Tailwind CSS + DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vue.js -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.js"></script>
  <style>[v-cloak] { display: none; }</style>
</head>
<body class="min-h-screen bg-base-200">
  <div id="app" v-cloak class="max-w-2xl mx-auto p-6">

    <h1 class="text-3xl font-bold mb-1">Catálogo de Oficinas</h1>
    <p class="text-base-content/70 mb-6">Adicione, favorite, filtre e exclua oficinas.</p>

    <!-- Formulário para adicionar oficina -->
    <form class="flex gap-2 mb-4" @submit.prevent="adicionarOficina">
      <input
        type="text"
        v-model="novaOficina"
        placeholder="Nome da nova oficina"
        class="input input-bordered flex-1"
      >
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>

    <!-- Filtros -->
    <div class="flex items-center gap-2 mb-4">
      <button
        class="btn btn-sm"
        :class="filtro === 'todas' ? 'btn-primary' : 'btn-outline'"
        @click="filtro = 'todas'"
      >
        Todas
      </button>
      <button
        class="btn btn-sm"
        :class="filtro === 'favoritas' ? 'btn-primary' : 'btn-outline'"
        @click="filtro = 'favoritas'"
      >
        Favoritas
      </button>
      <span class="ml-auto text-sm text-base-content/70">
        {{ oficinasVisiveis.length }} oficina(s)
      </span>
    </div>

    <!-- Estado vazio -->
    <div v-if="oficinasVisiveis.length === 0" class="alert">
      <span>Nenhuma oficina para mostrar.</span>
    </div>

    <!-- Lista de oficinas -->
    <ul v-else class="space-y-3">
      <li
        v-for="oficina in oficinasVisiveis"
        :key="oficina.id"
        class="card bg-base-100 shadow"
      >
        <div class="card-body flex-row items-center justify-between p-4">
          <div class="flex items-center gap-3">
            <span class="font-semibold">{{ oficina.titulo }}</span>
            <span v-if="oficina.favorita" class="badge badge-warning">Favorita</span>
          </div>

          <div class="flex gap-2">
            <button
              class="btn btn-sm"
              :class="oficina.favorita ? 'btn-warning' : 'btn-outline'"
              @click="alternarFavorito(oficina.id)"
            >
              {{ oficina.favorita ? 'Desfavoritar' : 'Favoritar' }}
            </button>
            <button class="btn btn-sm btn-error btn-outline" @click="removerOficina(oficina.id)">
              Excluir
            </button>
          </div>
        </div>
      </li>
    </ul>

  </div>

  <script>
    Vue.createApp({
      data() {
        return {
          novaOficina: '',
          filtro: 'todas',
          proximoId: 4,
          oficinas: [
            { id: 1, titulo: 'Introdução ao Vue.js', favorita: false },
            { id: 2, titulo: 'Git e GitHub', favorita: true },
            { id: 3, titulo: 'Design com Tailwind CSS', favorita: false }
          ]
        };
      },

      computed: {
        // TODO 4
        oficinasVisiveis() {
          if (this.filtro === 'favoritas') {
            return this.oficinas.filter(oficina => oficina.favorita);
          }
          return this.oficinas;
        }
      },

      methods: {
        // Já pronto (exemplo)
        limparCampo() {
          this.novaOficina = '';
        },

        // TODO 1
        adicionarOficina() {
          const titulo = this.novaOficina.trim();
          if (titulo === '') return;

          this.oficinas.push({
            id: this.proximoId,
            titulo: titulo,
            favorita: false
          });

          this.proximoId++;
          this.limparCampo();
        },

        // TODO 2
        alternarFavorito(id) {
          const oficina = this.oficinas.find(item => item.id === id);
          if (!oficina) return;

          oficina.favorita = !oficina.favorita;
        },

        // TODO 3
        removerOficina(id) {
          this.oficinas = this.oficinas.filter(item => item.id !== id);
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
